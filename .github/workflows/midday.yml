name: Midday Image (email-only)

on:
  schedule:
    - cron: "30 5 * * *"     # 05:30 UTC = 11:00 IST (target: late-morning / lunch-hour delivery)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midday-image
  cancel-in-progress: false

jobs:
  midday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Capture today's UTC date
        # generate_midday.py names its output files using date.today(), which in
        # CI is UTC. Pin the same UTC date here so subsequent steps can resolve
        # the file path without races at the UTC midnight boundary.
        run: echo "MIDDAY_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build today's midday image
        id: build
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          OUTPUT=$(python generate_midday.py)
          echo "$OUTPUT"
          # Extract day-in-cycle and mood for use in email subject/body
          DAY=$(echo "$OUTPUT" | grep -oP 'day_in_cycle=\K[0-9]+/[0-9]+')
          MOOD=$(echo "$OUTPUT" | grep -oP '^mood=\K\w+' | head -1)
          {
            echo "DAY=$DAY"
            echo "MOOD=$MOOD"
          } >> "$GITHUB_OUTPUT"

      - name: Stage IG + YT captions for email body
        id: captions
        run: |
          IG=$(cat "output/midday_${{ env.MIDDAY_DATE }}_ig.txt")
          YT=$(cat "output/midday_${{ env.MIDDAY_DATE }}_yt.txt")
          {
            echo 'IG_CAPTION<<EOF'
            echo "$IG"
            echo EOF
            echo 'YT_CAPTION<<EOF'
            echo "$YT"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Email — midday image + IG/YT captions
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: instaautomatic <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Midday Day ${{ steps.build.outputs.DAY }} [${{ steps.build.outputs.MOOD }}] — ready to post"
          body: |
            DAY ${{ steps.build.outputs.DAY }} of the rotation — mood: ${{ steps.build.outputs.MOOD }}

            ============================================================
            BEST POSTING TIMES (India)
            ============================================================
              Instagram Reels:   7:00 - 10:00 PM IST  (peak engagement)
              YouTube Shorts:    6:00 - 9:00 PM IST   (peak watch time)

              Email arrives at 11 AM so you can build the video early
              and schedule/post during the evening peak window.

            ============================================================
            WORKFLOW (3 min)
            ============================================================
              1. Download the PNG attachment
              2. Open CapCut → import PNG → add trending audio (7-15s)
              3. Export 1080x1920 → save to phone
              4. Paste the IG caption below into Instagram Reels
              5. Paste the YT caption below into YouTube Shorts

              TIP: pick a trending audio you saved from Instagram Reels
              earlier in the day — IG-native audio drives IG discovery.

            ============================================================
            INSTAGRAM caption (also attached as _ig.txt for offline save)
            ============================================================
            ${{ steps.captions.outputs.IG_CAPTION }}


            ============================================================
            YOUTUBE caption (also attached as _yt.txt for offline save)
            ============================================================
            ${{ steps.captions.outputs.YT_CAPTION }}


            ============================================================
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: |
            output/midday_${{ env.MIDDAY_DATE }}.png
            output/midday_${{ env.MIDDAY_DATE }}_ig.txt
            output/midday_${{ env.MIDDAY_DATE }}_yt.txt
