name: Midday Image (email-only)

on:
  # 2026-06-08: cron re-added at 2:00 AM IST per user direction. Both auto-
  # cron AND manual workflow_dispatch advance state/midday_cursor.json by 1.
  # So a day with the cron + 1 manual click = 2 distinct images emailed.
  # 2:00 AM IST = 20:30 UTC (previous day). GH Actions cron drifts 15-90
  # min late, so the email actually lands 2:15-3:30 AM IST — ready in the
  # user's inbox when they wake up to build the morning post.
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST (drift → 02:15-03:30 IST landing)
  workflow_dispatch:

permissions:
  # 'write' required so we can commit the advanced cursor back to the repo.
  contents: write

concurrency:
  group: midday-image
  cancel-in-progress: false

jobs:
  midday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Capture today's UTC date
        # generate_midday.py names its output files using date.today(), which in
        # CI is UTC. Pin the same UTC date here so subsequent steps can resolve
        # the file path without races at the UTC midnight boundary.
        run: echo "MIDDAY_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build today's midday image (advances cursor by 1)
        id: build
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          OUTPUT=$(python generate_midday.py)
          echo "$OUTPUT"
          # Extract post-number-in-cycle and mood for the email subject/body
          DAY=$(echo "$OUTPUT" | grep -oP 'post=\K[0-9]+/[0-9]+')
          MOOD=$(echo "$OUTPUT" | grep -oP '^mood=\K\w+' | head -1)
          {
            echo "DAY=$DAY"
            echo "MOOD=$MOOD"
          } >> "$GITHUB_OUTPUT"

      - name: Commit cursor advance
        # Persists the rotation cursor across workflow runs so a second
        # invocation picks the next line (not the same line again).
        run: |
          if git diff --quiet state/midday_cursor.json 2>/dev/null; then
            echo "cursor unchanged — skipping commit (likely --line-id override)"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add state/midday_cursor.json
          git commit -m "midday: advance cursor [skip ci]"
          git push origin HEAD

      - name: Stage IG + YT captions for email body
        id: captions
        run: |
          IG=$(cat "output/midday_${{ env.MIDDAY_DATE }}_ig.txt")
          YT=$(cat "output/midday_${{ env.MIDDAY_DATE }}_yt.txt")
          {
            echo 'IG_CAPTION<<EOF'
            echo "$IG"
            echo EOF
            echo 'YT_CAPTION<<EOF'
            echo "$YT"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Email — midday image + IG/YT captions
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: instaautomatic <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Midday Day ${{ steps.build.outputs.DAY }} [${{ steps.build.outputs.MOOD }}] — ready to post"
          body: |
            DAY ${{ steps.build.outputs.DAY }} of the rotation — mood: ${{ steps.build.outputs.MOOD }}

            This is your MORNING post. Evening post auto-publishes at ~19:30
            IST from the video pipeline — you don't need to touch that one.

            ============================================================
            BEST POSTING TIMES (India) — for THIS morning post
            ============================================================
              IG Reels morning peak:  7:00 - 10:00 AM IST  (commute + breakfast)
              YT Shorts morning peak: 8:00 - 10:00 AM IST  (start-of-day scroll)

              Email arrives ~06:00-07:30 IST so you have 1-4 hours to build
              the video + post during morning peak.

            ============================================================
            WORKFLOW (3 min)
            ============================================================
              1. Download the PNG attachment
              2. Open CapCut → import PNG → add trending audio (7-15s)
              3. Export 1080x1920 → save to phone
              4. Paste the IG caption below into Instagram Reels
              5. Paste the YT caption below into YouTube Shorts

              TIP: pick a trending audio you saved from Instagram Reels
              earlier in the day — IG-native audio drives IG discovery.

            ============================================================
            INSTAGRAM caption (copy-paste from below)
            ============================================================
            ${{ steps.captions.outputs.IG_CAPTION }}


            ============================================================
            YOUTUBE caption (copy-paste from below)
            ============================================================
            ${{ steps.captions.outputs.YT_CAPTION }}


            ============================================================
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: output/midday_${{ env.MIDDAY_DATE }}.png
