name: Daily 48 Laws Post

on:
  schedule:
    # 1 automated post/day — evening peak only.
    # 2026-06-04: dropped AM/lunch slot per user direction. User now posts
    # MORNING manually using midday-image email (arrives ~06:00 IST) +
    # trending audio + CapCut. This workflow handles ONLY the evening post.
    # GH Actions cron drifts 15-90 min late under load.
    - cron: "0 14 * * *"     # EVENING slot (14:00 UTC = 19:30 IST; drift -> lands ~19:45-21:00 IST, prime engagement peak)
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot for a manual run"
        type: choice
        options: ["AM", "PM"]
        default: "AM"

permissions:
  contents: write

# Per-slot concurrency: AM and PM never block each other, but a delayed run of
# the same slot queues (slot-aware idempotency in main.py then exits it cleanly).
concurrency:
  group: daily-post-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build the deterministic queue (idempotent)
        # CRITICAL: output/queue.json is gitignored, so the CI runner doesn't
        # have it on checkout. scheduled_item() reads queue.json at build time
        # — without this step it raises RuntimeError and tonight's post fails.
        # build_queue.py is deterministic from the KEEP_* sets in its source;
        # running it here always produces the same 66-item curated queue.
        env:
          QUEUE_START_DATE: ${{ vars.QUEUE_START_DATE }}
        run: python scripts/build_queue.py

      - name: Resolve posting slot
        run: |
          # 2026-06-05: AM cron removed (only PM exists now: "0 14 * * *").
          # The old condition checked the old PM cron string "30 12 * * *",
          # so after the cron change every triggered run was defaulting to
          # AM — completely wrong. Now any cron trigger is PM (because only
          # the PM cron exists). Manual runs default to PM too.
          if [ -n "${{ github.event.schedule }}" ]; then
            echo "POST_SLOT=PM" >> "$GITHUB_ENV"
          else
            echo "POST_SLOT=${{ inputs.slot || 'PM' }}" >> "$GITHUB_ENV"
          fi
          echo "Resolved POST_SLOT=$(grep POST_SLOT "$GITHUB_ENV" | tail -1)"

      - name: Build this slot's video
        env:
          START_DATE: ${{ vars.START_DATE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # 2026-06-07: keep stderr (don't 2>/dev/null) so TTS_FALLBACK_FIRED
          # / TTS_IMPORT_FAILED / PEXELS errors actually surface in the
          # workflow log. Previously silenced -> 36-hour rate-format bug
          # went undetected. Stdout still parsed for the ::VIDEO:: marker.
          python -c "from generate import build, scheduled_item; from main import current_day, current_slot; print('::VIDEO::'+build(scheduled_item(current_day(), current_slot()))['video'].name)" | tee /tmp/build.log | grep '^::VIDEO::' > /tmp/v || true
          name="$(sed 's/^::VIDEO:://' /tmp/v)"
          test -n "$name" || { echo "could not resolve built video name" >&2; exit 1; }
          echo "VIDEO_FILE=$name" >> "$GITHUB_ENV"
          echo "built: $name"

          # ============================================================
          # CI GUARDS — fail loudly if voice/SRT missing (else: voiceless
          # video silently ships, like 2026-06-05/06 with the rate bug).
          # ============================================================
          stem="${name%.mp4}"
          voice_mp3="output/${stem}_voice.mp3"
          srt_file="output/${stem}.srt"
          if [ ! -s "$voice_mp3" ]; then
            echo "FAIL: voice mp3 missing/empty ($voice_mp3) — TTS silently failed." >&2
            echo "(check the build log above for TTS_FALLBACK_FIRED / TTS_IMPORT_FAILED)" >&2
            grep -E "TTS_|PILMOJI_|VOICE_DUR_" /tmp/build.log >&2 || true
            exit 1
          fi
          if [ ! -s "$srt_file" ]; then
            echo "FAIL: SRT missing/empty ($srt_file) — captions won't be burned in." >&2
            exit 1
          fi
          echo "guards: voice=$(stat -c '%s' "$voice_mp3" 2>/dev/null || stat -f '%z' "$voice_mp3") bytes, srt=$(stat -c '%s' "$srt_file" 2>/dev/null || stat -f '%z' "$srt_file") bytes ✓"

      - name: Commit the posted video so its raw URL resolves
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # output/item_* is gitignored (no factory churn in git). The github
          # upload backend needs THIS one video committed so IG can fetch its
          # raw URL — force-add only it, not the whole output/ dir.
          rel="output/$(basename "$VIDEO_FILE")"
          git add -f "$rel"
          # SELF-CLEAN: drop every previously-committed posted video so the
          # repo never accumulates them (only the current one stays, just long
          # enough for IG to fetch its raw URL). Prevents endless bloat.
          git ls-files 'output/item_*.mp4' | grep -vx "$rel" | xargs -r git rm -q --ignore-unmatch
          git commit -m "build+clean: ${rel} [skip ci]" || { echo "no changes"; exit 0; }
          # Bounded rebase-retry: a concurrent manual/cron push moving the
          # branch must NOT non-fast-forward-fail the day. [skip ci] keeps the
          # rebased auto-commit from re-triggering the workflow.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "ERROR: could not push output after 5 rebase-retries" >&2
          exit 1

      - name: Post to Instagram + YouTube
        id: post
        env:
          START_DATE: ${{ vars.START_DATE }}
          # main.py calls build() again (idempotent — re-renders use the
          # bg cache from the prior step). PEXELS_API_KEY needed here too
          # so the cache lookup + any miss-path falls through Pexels, not
          # paintings.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          UPLOAD_BACKEND: github
          GITHUB_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # IG auto-post stays ON. Meta silently throttled this account after
          # the 05-23 retry storm (containers POST 200, never reach FINISHED),
          # so individual slots will fail with TimeoutError until the throttle
          # clears (~24-72h). Owner's call: keep retrying automatically rather
          # than fall back to manual posting. The post-pack email still ships
          # as a harmless backup so if IG times out, the .mp4 + caption arrive
          # ready-to-paste if owner wants to post manually that slot.
          IG_AUTOPOST_ENABLED: 'true'
        run: python main.py

      - name: Stage post-pack as email body
        if: success() && steps.post.outputs.post_pack_path != ''
        id: stage_email
        run: |
          # printf guarantees the BODY content and the closing delimiter each
          # land on their own line, even if the pack file doesn't end in \n.
          # Previous heredoc used `cat` + `echo`; when the file ended without
          # \n the closing 'POSTPACK_EOF' fused with the last content line and
          # GHA bailed with "Matching delimiter not found".
          {
            printf 'BODY<<POSTPACK_EOF\n'
            cat "${{ steps.post.outputs.post_pack_path }}"
            printf '\nPOSTPACK_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Email — IG ready to post manually
        if: success() && env.MAIL_USERNAME != '' && steps.post.outputs.skipped != 'true'
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: instaautomatic <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[POST IG] ${{ steps.post.outputs.slot }} — ${{ steps.post.outputs.tease }}"
          body: ${{ steps.stage_email.outputs.BODY }}
          attachments: ${{ steps.post.outputs.video_file_relpath }}

      - name: Email — failure
        if: failure() && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: instaautomatic <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[FAIL] ${{ steps.post.outputs.slot }} post FAILED — ${{ steps.post.outputs.tease }}"
          body: |
            The daily post workflow FAILED.

            Slot:    ${{ steps.post.outputs.slot }}
            Content: ${{ steps.post.outputs.tease }}
            Type:    ${{ steps.post.outputs.variant }}  (item #${{ steps.post.outputs.item }})
            Source:  ${{ steps.post.outputs.parent }} — ${{ steps.post.outputs.book }}

            Check the run logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Common causes:
            - IG_ACCESS_TOKEN expired (re-run "Refresh IG Access Token" workflow)
            - GitHub raw URL not yet propagated for the just-built video (re-run this workflow)
            - Meta API rate-limited (wait, retry)
